  \"itemListElement\": [\n    { \"@type\": \"ListItem\", \"position\": 1, \"name\": \"Startseite\", \"item\": \"https://solvera-sales.com/\" },\n    { \"@type\": \"ListItem\", \"position\": 2, \"name\": \"Door-to-Door-Vertrieb\", \"item\": \"https://solvera-sales.com/d2d-vertrieb.html\" }\n  ]\n}\n<\/script>\n<!-- FAQ-Strukturdaten: erzeugt von tools/faq-strukturdaten.py -->\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"FAQPage\",\n  \"mainEntity\": [\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Was bedeutet D2D im Vertrieb?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"D2D ist die Abkürzung für Door-to-Door, also Vertrieb an der Haustür. Der Vertriebspartner sucht Haushalte in einem festgelegten Gebiet persönlich auf, statt sie anzurufen oder anzuschreiben.\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Wird an der Haustür etwas verkauft?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"Bei uns nicht. Es wird nichts unterschrieben, nichts kassiert und nichts mitgegeben. Das einzige Ergebnis eines Gesprächs ist ein kostenloser, unverbindlicher Beratungstermin mit einem Photovoltaik-Fachbetrieb. Der Kunde entscheidet erst nach diesem Termin und in Ruhe, ob er ein Angebot möchte.\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Wie viele Gespräche führt man an einem Einsatztag?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"Das schwankt stark mit Gebiet, Wetter und Tageszeit. An einem Einsatztag von fünf bis sieben Stunden kommen deutlich mehr Türen zusammen als Gespräche – bei vielen ist niemand zu Hause. Aus den Gesprächen, die zustande kommen, erreichen eingearbeitete Vertriebspartner im Durchschnitt rund zehn qualifizierte Termine je Einsatztag.\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Braucht man Erfahrung im Door-to-Door-Vertrieb?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"Nein. Rund die Hälfte unserer Vertriebspartner sind Quereinsteiger. Gesprächsführung, Produktwissen und Ablauf lernen Sie in einer kostenfreien Ausbildung, danach begleitet Sie ein Mentor im Außendienst.\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"In welchem Verhältnis arbeitet man?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"Selbstständig auf Provisionsbasis mit Kleingewerbe. Bei der Anmeldung und bei steuerlichen Fragen unterstützen wir Sie. Die Einsatztage teilen Sie sich selbst ein, eine feste Stundenzahl gibt es nicht.\"\n      }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Wo sind die Einsatzgebiete?\",\n      \"acceptedAnswer\": {\n        \"@type\": \"Answer\",\n        \"text\": \"In Baden-Württemberg mit Sitz in Karlsruhe und in Berlin. Beide Standorte haben eine eigene Teamleitung; die Ausbildung findet in Karlsruhe statt.\"\n      }\n    }\n  ]\n}\n<\/script>\n<!-- /FAQ-Strukturdaten -->\n<\/head>\n<body>\n<a class=\"skip\" href=\"#main\">Zum Inhalt springen<\/a>\n\n<header class=\"header\" id=\"header\">\n  <div class=\"wrap\">\n    <a class=\"brand\" href=\"index.html\" aria-label=\"Solvera Sales GmbH – Startseite\">\n      <img class=\"brand-mark\" src=\"%SOLVERA_IMG:logo-mark.png%\" alt=\"\" width=\"240\" height=\"331\">\n      <img class=\"brand-wort\" src=\"%SOLVERA_IMG:logo-wortmarke.png%\" alt=\"Solvera Sales\" width=\"620\" height=\"154\">\n    <\/a>\n\n    <nav class=\"nav\" aria-label=\"Hauptnavigation\">\n      <a href=\"index.html\">Start<\/a>\n      <a href=\"bewerben.html\" class=\"nav-cta\">Bewerben<\/a>\n      <a href=\"photovoltaik.html\">Photovoltaikanlage<\/a>\n      <a href=\"photovoltaik-firmen.html\">Firmenkunden<\/a>\n      <a href=\"ueber-uns.html\">Über uns<\/a>\n    <\/nav>\n\n    <div class=\"header-cta\">\n      <a class=\"btn btn-primary btn-sm nur-mobil\" href=\"bewerben.html\">Bewerben<\/a>\n      <button class=\"burger\" id=\"burger\" aria-label=\"Menü öffnen\" aria-expanded=\"false\" aria-controls=\"mobile-nav\">\n        <span><\/span><span><\/span><span><\/span>\n      <\/button>\n    <\/div>\n  <\/div>\n<\/header>\n\n<nav class=\"mobile-nav\" id=\"mobile-nav\" aria-label=\"Mobile Navigation\">\n  <a href=\"index.html\">Start<\/a>\n  <a href=\"bewerben.html\">Bewerben<\/a>\n  <a href=\"photovoltaik.html\">Photovoltaikanlage<\/a>\n  <a href=\"photovoltaik-firmen.html\">Firmenkunden<\/a>\n  <a href=\"ueber-uns.html\">Über uns<\/a>\n  <a class=\"btn btn-primary btn-full btn-lg\" href=\"bewerben.html\">Jetzt bewerben<\/a>\n<\/nav>\n\n<main id=\"main\">\n\n<!-- ===================== HERO ===================== -->\n<section class=\"hero bg-grid\">\n  <div class=\"wrap\">\n    <div style=\"max-width:900px\">\n      <span class=\"eyebrow\">Direktvertrieb<\/span>\n      <h1 class=\"mt-16\">Door-to-Door:<br><span class=\"grad-text\">was D2D wirklich heißt.<\/span><\/h1>\n      <p class=\"lead mt-24\" style=\"max-width:44em\">\n        D2D steht für Door-to-Door – Vertrieb an der Haustür. Wir setzen ihn für Photovoltaik ein:\n        Unsere Vertriebspartner sprechen Eigentümer direkt an und vereinbaren Beratungstermine\n        für Fachbetriebe.\n      <\/p>\n      <div class=\"hero-actions\">\n        <a class=\"btn btn-primary btn-lg\" href=\"bewerben.html\">Als Vertriebspartner bewerben\n          <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg>\n        <\/a>\n        <a class=\"btn btn-ghost btn-lg\" href=\"#ablauf\">Ablauf ansehen<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===================== SPRUNGMARKEN ===================== -->\n<nav class=\"subnav\" aria-label=\"Abschnitte dieser Seite\">\n  <div class=\"wrap subnav-inner\">\n    <a href=\"#begriff\">Der Begriff<\/a>\n    <a href=\"#ablauf\">Einsatztag<\/a>\n    <a href=\"#verdienst\">Verdienst<\/a>\n    <a href=\"#eignung\">Eignung<\/a>\n    <a href=\"#vorurteile\">Vorurteile<\/a>\n    <a href=\"#faq\">Häufige Fragen<\/a>\n  <\/div>\n<\/nav>\n\n<!-- ===================== BEGRIFF ===================== -->\n<section class=\"section\" id=\"begriff\">\n  <div class=\"wrap\">\n    <div class=\"grid g-2\" style=\"gap:clamp(32px,5vw,60px);align-items:start\">\n      <div class=\"reveal\">\n        <span class=\"eyebrow\">Der Begriff<\/span>\n        <h2 class=\"mt-16\">D2D, Door-to-Door, Direktvertrieb<\/h2>\n        <p class=\"lead mt-24\">\n          Drei Wörter für dieselbe Sache: Sie stehen dem Menschen gegenüber, statt ihn anzurufen\n          oder anzuschreiben.\n        <\/p>\n        <p class=\"muted mt-16\">\n          Der Reiz liegt genau darin. Ein Anruf wird weggedrückt, eine Anzeige weggeklickt.\n          An der Tür entsteht ein echtes Gespräch – und aus einem echten Gespräch wird ein Termin,\n          den der Kunde auch wahrnimmt.\n        <\/p>\n      <\/div>\n\n      <div class=\"reveal reveal-d1\">\n        <div class=\"card\" style=\"padding:clamp(26px,4vw,38px)\">\n          <span class=\"eyebrow\">Abgrenzung<\/span>\n          <h3 class=\"mt-16\">Was D2D bei uns <em>nicht<\/em> ist<\/h3>\n          <ul class=\"check-list mt-24\">\n            <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span><strong>Kein Verkauf an der Tür.<\/strong> Es wird nichts unterschrieben und nichts kassiert. Ergebnis ist ein Termin, sonst nichts.<\/span><\/li>\n            <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span><strong>Kein Telefonvertrieb.<\/strong> Keine Callcenter-Listen, keine Kaltakquise am Bildschirm.<\/span><\/li>\n            <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span><strong>Keine Promotion.<\/strong> Kein Stand in der Fußgängerzone, keine Passanten.<\/span><\/li>\n            <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span><strong>Kein Vertriebsstrukturmodell.<\/strong> Sie werben keine Leute an, um an deren Umsatz zu verdienen.<\/span><\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===================== ABLAUF ===================== -->\n<section class=\"section section-alt\" id=\"ablauf\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Einsatztag<\/span>\n      <h2>Wie ein Tag im D2D-Vertrieb abläuft<\/h2>\n      <p class=\"lead\">Vier Schritte, immer dieselben.<\/p>\n    <\/div>\n\n    <div class=\"grid g-4\">\n      <article class=\"card card-hover reveal\">\n        <div class=\"ico-tile\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 3 3 5.5v15L9 18l6 3 6-2.5v-15L15 6 9 3Z\"/><path d=\"M9 3v15M15 6v15\"/><\/svg><\/div>\n        <h3 class=\"mt-16\">1 · Gebiet<\/h3>\n        <p class=\"muted mt-8\">Sie bekommen ein festes Gebiet für den Tag – Einfamilienhäuser, kein Mehrfamilienhaus, keine Innenstadt. Die Route liegt in der App.<\/p>\n      <\/article>\n      <article class=\"card card-hover reveal reveal-d1\">\n        <div class=\"ico-tile\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20.5 12a8.5 8.5 0 0 1-11.9 7.8L3.5 21l1.3-4.8A8.5 8.5 0 1 1 20.5 12Z\"/><\/svg><\/div>\n        <h3 class=\"mt-16\">2 · Gespräch<\/h3>\n        <p class=\"muted mt-8\">Sie klingeln, stellen sich vor und finden in zwei Minuten heraus, ob das Thema passt: Eigentümer, geeignetes Dach, Interesse.<\/p>\n      <\/article>\n      <article class=\"card card-hover reveal reveal-d2\">\n        <div class=\"ico-tile\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2.4\"/><path d=\"M3 10h18M8 3v4M16 3v4\"/><\/svg><\/div>\n        <h3 class=\"mt-16\">3 · Termin<\/h3>\n        <p class=\"muted mt-8\">Passt es, vereinbaren Sie einen kostenlosen, unverbindlichen Beratungstermin mit dem Fachbetrieb und erfassen ihn direkt am Telefon.<\/p>\n      <\/article>\n      <article class=\"card card-hover reveal reveal-d3\">\n        <div class=\"ico-tile\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 17l6-6 4 4 8-8\"/><path d=\"M15 7h6v6\"/><\/svg><\/div>\n        <h3 class=\"mt-16\">4 · Provision<\/h3>\n        <p class=\"muted mt-8\">Der Fachbetrieb übernimmt. Für Sie ist der Auftrag erledigt – 70 € je qualifiziertem Lead, unabhängig vom Ausgang des Termins.<\/p>\n      <\/article>\n    <\/div>\n\n    <div class=\"card card-pad-sm mt-32 reveal\" style=\"max-width:60em\">\n      <p class=\"small muted\">\n        Ein Einsatztag dauert in der Regel fünf bis sieben Stunden, meist nachmittags und am\n        frühen Abend – dann sind Eigentümer zu Hause. Wann Sie arbeiten, teilen Sie sich selbst ein.\n      <\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===================== VERDIENST ===================== -->\n<section class=\"section\" id=\"verdienst\">\n  <div class=\"wrap\">\n    <div class=\"grid g-2\" style=\"gap:clamp(32px,5vw,60px);align-items:center\">\n      <div class=\"reveal\">\n        <span class=\"eyebrow\">Verdienst<\/span>\n        <h2 class=\"mt-16\">Was man im <span class=\"grad-text\">D2D-Vertrieb verdient<\/span><\/h2>\n        <p class=\"lead mt-24\">\n          Bei uns 70 € je qualifiziertem Lead. Ein Satz, keine Staffelung, keine Obergrenze.\n        <\/p>\n        <p class=\"muted mt-16\">\n          Eingearbeitete Vertriebspartner erreichen im Durchschnitt rund zehn Leads je Einsatztag.\n          Bezahlt wird der Termin, nicht der Verkauf – ein späterer Widerruf des Kunden kostet\n          Sie nichts.\n        <\/p>\n        <a class=\"btn btn-primary btn-lg mt-32\" href=\"bewerben.html#verguetung\">Eigene Werte berechnen\n          <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg>\n        <\/a>\n      <\/div>\n\n      <div class=\"reveal reveal-d1\">\n        <div class=\"card\" style=\"padding:clamp(26px,4vw,38px)\">\n          <span class=\"eyebrow\">Beispiel<\/span>\n          <div class=\"result-hero mt-24\">\n            <div class=\"label\">10 Leads × 15 Einsatztage<\/div>\n            <div class=\"value\">10.500 €<\/div>\n            <div class=\"sub\">150 qualifizierte Leads × 70 €<\/div>\n          <\/div>\n          <p class=\"result-note\">\n            Beispielrechnung ohne Zusage einer bestimmten Vergütungshöhe. Steuern und Abgaben\n            sind nicht berücksichtigt.\n          <\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===================== EIGNUNG ===================== -->\n<section class=\"section section-alt\" id=\"eignung\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Eignung<\/span>\n      <h2>Für wen D2D passt – und für wen nicht<\/h2>\n      <p class=\"lead\">Die Tätigkeit ist nicht für jeden. Das sagen wir lieber vorher.<\/p>\n    <\/div>\n\n    <div class=\"grid g-2\">\n      <article class=\"card reveal\" style=\"padding:clamp(24px,3.5vw,34px)\">\n        <h3>Passt gut, wenn Sie …<\/h3>\n        <ul class=\"check-list mt-20\">\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span>gern mit fremden Menschen ins Gespräch kommen<\/span><\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span>eine Absage als Teil des Tages sehen, nicht als Bewertung Ihrer Person<\/span><\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span>lieber nach Leistung bezahlt werden als nach Anwesenheit<\/span><\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span>sich selbst organisieren können, ohne dass jemand danebensteht<\/span><\/li>\n        <\/ul>\n      <\/article>\n\n      <article class=\"card reveal reveal-d1\" style=\"padding:clamp(24px,3.5vw,34px)\">\n        <h3>Passt weniger, wenn Sie …<\/h3>\n        <ul class=\"check-list mt-20\" style=\"--haken:var(--txt-3)\">\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" style=\"color:var(--txt-3)\"><path d=\"M18 6 6 18M6 6l12 12\"/><\/svg><span>ein festes Gehalt zum Monatsende brauchen<\/span><\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" style=\"color:var(--txt-3)\"><path d=\"M18 6 6 18M6 6l12 12\"/><\/svg><span>Absagen persönlich nehmen – an manchen Türen wird nicht freundlich reagiert<\/span><\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" style=\"color:var(--txt-3)\"><path d=\"M18 6 6 18M6 6l12 12\"/><\/svg><span>bei jedem Wetter lieber drinnen bleiben<\/span><\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" style=\"color:var(--txt-3)\"><path d=\"M18 6 6 18M6 6l12 12\"/><\/svg><span>klare Vorgaben brauchen, wann was zu tun ist<\/span><\/li>\n        <\/ul>\n      <\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===================== VORURTEILE ===================== -->\n<section class=\"section\" id=\"vorurteile\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Klartext<\/span>\n      <h2>Drei Vorurteile über Door-to-Door<\/h2>\n    <\/div>\n\n    <div class=\"grid g-3\">\n      <article class=\"card reveal\" style=\"padding:clamp(24px,3.5vw,32px)\">\n        <span class=\"eyebrow\">Vorurteil<\/span>\n        <h3 class=\"mt-12\">„Das ist Klinkenputzen.“<\/h3>\n        <div class=\"divider\" style=\"margin:20px 0\"><\/div>\n        <p class=\"muted small\">\n          Der Ausdruck stammt aus einer Zeit, in der Staubsauger an der Tür verkauft wurden.\n          Photovoltaik ist ein Thema, mit dem sich Eigentümer ohnehin beschäftigen – die\n          Förderlage ändert sich jedes Jahr. Sie bringen eine Information, keine Ware.\n        <\/p>\n      <\/article>\n\n      <article class=\"card reveal reveal-d1\" style=\"padding:clamp(24px,3.5vw,32px)\">\n        <span class=\"eyebrow\">Vorurteil<\/span>\n        <h3 class=\"mt-12\">„Man muss Leute überreden.“<\/h3>\n        <div class=\"divider\" style=\"margin:20px 0\"><\/div>\n        <p class=\"muted small\">\n          Das Gegenteil ist wirtschaftlich sinnvoll. Ein überredeter Kunde sagt den Termin ab\n          oder erscheint nicht – und ein Termin, der nicht stattfindet, nützt niemandem.\n          Wer sich nicht interessiert, bekommt ein „Danke, schönen Tag“.\n        <\/p>\n      <\/article>\n\n      <article class=\"card reveal reveal-d2\" style=\"padding:clamp(24px,3.5vw,32px)\">\n        <span class=\"eyebrow\">Vorurteil<\/span>\n        <h3 class=\"mt-12\">„Das ist doch nicht mehr zeitgemäß.“<\/h3>\n        <div class=\"divider\" style=\"margin:20px 0\"><\/div>\n        <p class=\"muted small\">\n          Genau deshalb wirkt es. Werbung im Netz wird weggeklickt, Anrufe werden weggedrückt.\n          Ein Mensch an der Tür bekommt zwei Minuten Aufmerksamkeit – und darum kaufen\n          Photovoltaik-Betriebe diese Termine ein.\n        <\/p>\n      <\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===================== FAQ ===================== -->\n<section class=\"section section-alt\" id=\"faq\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Häufige Fragen<\/span>\n      <h2>D2D-Vertrieb in Kürze<\/h2>\n    <\/div>\n\n    <div class=\"faq\">\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\" type=\"button\">Was bedeutet D2D im Vertrieb?\n          <svg class=\"faq-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n        <\/button>\n        <div class=\"faq-a\"><div><p>D2D ist die Abkürzung für Door-to-Door, also Vertrieb an der Haustür. Der Vertriebspartner sucht Haushalte in einem festgelegten Gebiet persönlich auf, statt sie anzurufen oder anzuschreiben.<\/p><\/div><\/div>\n      <\/div>\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\" type=\"button\">Wird an der Haustür etwas verkauft?\n          <svg class=\"faq-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n        <\/button>\n        <div class=\"faq-a\"><div><p>Bei uns nicht. Es wird nichts unterschrieben, nichts kassiert und nichts mitgegeben. Das einzige Ergebnis eines Gesprächs ist ein kostenloser, unverbindlicher Beratungstermin mit einem Photovoltaik-Fachbetrieb.<\/p><p>Der Kunde entscheidet erst nach diesem Termin und in Ruhe, ob er ein Angebot möchte.<\/p><\/div><\/div>\n      <\/div>\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\" type=\"button\">Wie viele Gespräche führt man an einem Einsatztag?\n          <svg class=\"faq-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n        <\/button>\n        <div class=\"faq-a\"><div><p>Das schwankt stark mit Gebiet, Wetter und Tageszeit. An einem Einsatztag von fünf bis sieben Stunden kommen deutlich mehr Türen zusammen als Gespräche – bei vielen ist niemand zu Hause.<\/p><p>Aus den Gesprächen, die zustande kommen, erreichen eingearbeitete Vertriebspartner im Durchschnitt rund zehn qualifizierte Termine je Einsatztag.<\/p><\/div><\/div>\n      <\/div>\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\" type=\"button\">Braucht man Erfahrung im Door-to-Door-Vertrieb?\n          <svg class=\"faq-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n        <\/button>\n        <div class=\"faq-a\"><div><p>Nein. Rund die Hälfte unserer Vertriebspartner sind Quereinsteiger. Gesprächsführung, Produktwissen und Ablauf lernen Sie in einer kostenfreien Ausbildung, danach begleitet Sie ein Mentor im Außendienst.<\/p><\/div><\/div>\n      <\/div>\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\" type=\"button\">In welchem Verhältnis arbeitet man?\n          <svg class=\"faq-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n        <\/button>\n        <div class=\"faq-a\"><div><p>Selbstständig auf Provisionsbasis mit Kleingewerbe. Bei der Anmeldung und bei steuerlichen Fragen unterstützen wir Sie. Die Einsatztage teilen Sie sich selbst ein, eine feste Stundenzahl gibt es nicht.<\/p><\/div><\/div>\n      <\/div>\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\" type=\"button\">Wo sind die Einsatzgebiete?\n          <svg class=\"faq-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n        <\/button>\n        <div class=\"faq-a\"><div><p>In Baden-Württemberg mit Sitz in Karlsruhe und in Berlin. Beide Standorte haben eine eigene Teamleitung; die Ausbildung findet in Karlsruhe statt.<\/p><\/div><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===================== ABSCHLUSS ===================== -->\n<section class=\"section-tight\">\n  <div class=\"wrap\">\n    <div class=\"card reveal\" style=\"display:flex;align-items:center;justify-content:space-between;gap:26px;flex-wrap:wrap;padding:clamp(26px,4vw,40px)\">\n      <div>\n        <span class=\"eyebrow\">Karriere<\/span>\n        <h3 class=\"mt-16\">Klingt nach Ihnen?<\/h3>\n        <p class=\"muted mt-8\" style=\"max-width:48em\">\n          Wir stellen in Baden-Württemberg und Berlin laufend Vertriebspartner ein.\n          Rückmeldung innerhalb von 48 Stunden.\n        <\/p>\n      <\/div>\n      <a class=\"btn btn-primary\" href=\"bewerben.html\">Jetzt bewerben\n        <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg>\n      <\/a>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\/main>\n\n\n<footer class=\"footer\">\n  <div class=\"wrap\">\n    <div class=\"footer-top\">\n      <div class=\"footer-about\">\n        <a class=\"brand brand-gross\" href=\"index.html\">\n          <img class=\"brand-mark\" src=\"%SOLVERA_IMG:logo-mark.png%\" alt=\"\" width=\"240\" height=\"331\">\n          <img class=\"brand-wort\" src=\"%SOLVERA_IMG:logo-wortmarke.png%\" alt=\"Solvera Sales\" width=\"620\" height=\"154\">\n        <\/a>\n        <p>\n          Vertriebsdienstleister für die Photovoltaik-Branche. Wir gewinnen qualifizierte\n          Kundenkontakte für Fachbetriebe und bilden Vertriebspartner in Baden-Württemberg und Berlin aus.\n        <\/p>\n        <!-- Symbole erscheinen automatisch, sobald in assets/js/config.js\n             unter \"social\" eine Profil-URL hinterlegt ist. -->\n        <div class=\"social-row\" data-social><\/div>\n      <\/div>\n\n      <div>\n        <h5>Für Bewerber<\/h5>\n        <nav class=\"footer-links\">\n          <a href=\"bewerben.html#verguetung\">Vergütung<\/a>\n          <a href=\"bewerben.html#aufstieg\">Entwicklung<\/a>\n          <a href=\"d2d-vertrieb.html\">Door-to-Door-Vertrieb<\/a>\n          <a href=\"bewerben.html#formular\">Jetzt bewerben<\/a>\n          <a href=\"bewerben.html#faq\">Häufige Fragen<\/a>\n        <\/nav>\n      <\/div>\n\n      <div>\n        <h5>Unternehmen<\/h5>\n        <nav class=\"footer-links\">\n          <a href=\"ueber-uns.html\">Über uns<\/a>\n          <a href=\"ueber-uns.html#standorte\">Standorte<\/a>\n          <a href=\"photovoltaik.html\">Photovoltaik &amp; Förderung<\/a>\n          <a href=\"photovoltaik-firmen.html\">Firmenkunden<\/a>\n        <\/nav>\n      <\/div>\n\n      <div>\n        <h5>Kontakt<\/h5>\n        <nav class=\"footer-links\">\n          <a href=\"bewerben.html\">Jetzt bewerben<\/a>\n          <a href=\"mailto:info@solvera-sales.com\">info@solvera-sales.com<\/a>\n          <span class=\"small muted\" style=\"line-height:1.6\">Karlsruhe und Berlin<\/span>\n        <\/nav>\n      <\/div>\n    <\/div>\n\n    <div class=\"footer-bottom\">\n      <span>© <span data-year>2026<\/span> Solvera Sales GmbH. All   var MITTEL = {"css": "/* =========================================================================\n   Solvera Sales GmbH – Design System\n   Dark / Solar-Gold. Keine externen Requests (DSGVO-freundlich, kein Banner\n   fuer Fonts noetig). Alle Farben & Abstaende als Custom Properties.\n   ========================================================================= */\n\n/* ---------- 1. Tokens ---------- */\n:root {\n  /* Flaechen – Obsidian, neutral mit minimal warmem Kern */\n  --bg:            #0b0b0d;\n  --bg-alt:        #101012;\n  --surface:       #151518;\n  --surface-2:     #1c1c20;\n  --surface-3:     #26262b;\n\n  /* Linien */\n  --line:          rgba(255, 255, 255, .08);\n  --line-strong:   rgba(255, 255, 255, .17);\n\n  /* Text – Platin */\n  --txt:           #f5f4f2;\n  --txt-2:         #a8a5a0;\n  --txt-3:         #8a8781;\n\n  /* Marke – gedecktes Messing, sparsam eingesetzt */\n  --brass:         #c0a16b;\n  --brass-light:   #dcc394;\n  --brass-deep:    #8a6f42;\n  --brass-text:    #c0a16b;\n  --brass-soft:    rgba(192, 161, 107, .11);\n  --brass-line:    rgba(192, 161, 107, .3);\n\n  /* Hauptschaltflaeche: Platin auf Schwarz */\n  --btn-fill:      #f5f4f2;\n  --btn-fill-hi:   #ffffff;\n  --btn-txt:       #0b0b0d;\n\n  /* Status – gedeckt */\n  --ok:            #7ba98f;\n  --ok-soft:       rgba(123, 169, 143, .12);\n  --info:          #8098b4;\n  --warn:          #c0a16b;\n  --err:           #c97f7f;\n  --err-soft:      rgba(201, 127, 127, .12);\n\n  /* Typo */\n  --font: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\",\n          Arial, \"Noto Sans\", sans-serif;\n  --mono: ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Consolas, monospace;\n\n  /* Raster */\n  --wrap: 1200px;\n  --wrap-narrow: 820px;\n  --radius:    14px;\n  --radius-lg: 22px;\n  --radius-sm: 10px;\n\n  /* Schatten */\n  --shadow:    0 18px 50px -18px rgba(0, 0, 0, .8);\n  --shadow-lg: 0 40px 90px -30px rgba(0, 0, 0, .9);\n  --glow:      0 0 0 1px var(--brass-line), 0 24px 60px -24px rgba(0, 0, 0, .85);\n\n  --header-h: 74px;\n}\n\n/* ---------- 2. Reset ---------- */\n*, *::before, *::after { box-sizing: border-box; }\n* { margin: 0; }\n\nhtml {\n  scroll-behavior: smooth;\n  scroll-padding-top: calc(var(--header-h) + 16px);\n  -webkit-text-size-adjust: 100%;\n}\n\nbody {\n  background: var(--bg);\n  color: var(--txt);\n  font-family: var(--font);\n  font-size: 17px;\n  line-height: 1.65;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  overflow-x: hidden;\n}\n\nimg, svg, video { display: block; max-width: 100%; }\nbutton, input, select, textarea { font: inherit; color: inherit; }\nbutton { cursor: pointer; background: none; border: 0; }\na { color: inherit; text-decoration: none; }\nul, ol { list-style: none; padding: 0; }\n\n:focus-visible {\n  outline: 2px solid var(--brass-text);\n  outline-offset: 3px;\n  border-radius: 4px;\n}\n\n::selection { background: var(--brass); color: #14100a; }\n\n/* ---------- 3. Typo-Skala ---------- */\nh1, h2, h3, h4 {\n  line-height: 1.1;\n  letter-spacing: -.025em;\n  font-weight: 800;\n  text-wrap: balance;\n  overflow-wrap: break-word;\n  hyphens: auto;\n}\nh1 { font-size: clamp(2.25rem, 5.2vw, 3.75rem); }\nh2 { font-size: clamp(1.9rem, 4vw, 3rem); }\nh3 { font-size: clamp(1.2rem, 2vw, 1.5rem); letter-spacing: -.015em; }\nh4 { font-size: 1.05rem; letter-spacing: -.01em; font-weight: 700; }\np  { text-wrap: pretty; }\n\n.lead      { font-size: clamp(1.05rem, 1.7vw, 1.24rem); color: var(--txt-2); line-height: 1.6; }\n.muted     { color: var(--txt-2); }\n.small     { font-size: .9rem; }\n.tiny      { font-size: .8rem; line-height: 1.5; color: var(--txt-3); }\n.accent    { color: var(--brass-text); }\n.nowrap    { white-space: nowrap; }\n.center    { text-align: center; }\n\n.grad-text {\n  background: linear-gradient(100deg, #e8d5ad 0%, var(--brass) 48%, #a3834e 100%);\n  -webkit-background-clip: text;\n  background-clip: text;\n  color: transparent;\n}\n\n/* ---------- 4. Layout ---------- */\n.wrap {\n  width: 100%;\n  max-width: var(--wrap);\n  margin-inline: auto;\n  padding-inline: 22px;\n}\n.wrap-narrow { max-width: var(--wrap-narrow); }\n\nsection { position: relative; }\n.section      { padding-block: clamp(64px, 9vw, 118px); }\n.section-tight{ padding-block: clamp(48px, 6vw, 76px); }\n.section-alt  { background: var(--bg-alt); border-block: 1px solid var(--line); }\n\n.grid { display: grid; gap: 22px; }\n.grid > * { min-width: 0; }\n.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }\n.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }\n\n.stack   { display: flex; flex-direction: column; }\n.row     { display: flex; align-items: center; flex-wrap: wrap; }\n.gap-8   { gap: 8px; }  .gap-12 { gap: 12px; } .gap-16 { gap: 16px; }\n.gap-24  { gap: 24px; } .gap-32 { gap: 32px; }\n.mt-8 { margin-top: 8px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }\n.mt-32 { margin-top: 32px; } .mt-40 { margin-top: 40px; } .mt-48 { margin-top: 48px; }\n\n/* Sektionskopf */\n.section-head { max-width: 760px; margin-bottom: clamp(34px, 5vw, 54px); }\n.section-head.center { margin-inline: auto; text-align: center; }\n.section-head h2 { margin-top: 14px; }\n.section-head .lead { margin-top: 18px; }\n\n.eyebrow {\n  display: inline-flex;\n  align-items: center;\n  gap: 9px;\n  font-size: .74rem;\n  font-weight: 700;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  color: var(--brass-text);\n}\n.eyebrow::before {\n  content: \"\";\n  width: 22px; height: 2px;\n  background: linear-gradient(90deg, var(--brass-text), transparent);\n  border-radius: 2px;\n}\n.section-head.center .eyebrow::before { display: none; }\n\n/* ---------- 5. Buttons ---------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 10px;\n  padding: 14px 26px;\n  border-radius: 999px;\n  font-weight: 700;\n  font-size: .97rem;\n  letter-spacing: -.01em;\n  border: 1px solid transparent;\n  transition: transform .18s ease, box-shadow .25s ease, background .2s ease,\n              border-color .2s ease, color .2s ease;\n  white-space: nowrap;\n}\n.btn:hover { transform: translateY(-2px); }\n.btn:active { transform: translateY(0); }\n\n.btn-primary {\n  background: var(--btn-fill);\n  color: var(--btn-txt);\n  box-shadow: 0 10px 26px -14px rgba(0, 0, 0, .9);\n}\n.btn-primary:hover { background: var(--btn-fill-hi); }\n.btn-primary:hover { box-shadow: 0 16px 36px -14px rgba(0, 0, 0, .9); }\n\n.btn-ghost {\n  background: rgba(255, 255, 255, .04);\n  border-color: var(--line-strong);\n  color: var(--txt);\n  backdrop-filter: blur(8px);\n}\n.btn-ghost:hover { background: rgba(255, 255, 255, .09); border-color: var(--brass-line); }\n\n.btn-outline { border-color: var(--brass-line); color: var(--brass-text); background: var(--brass-soft); }\n.btn-outline:hover { background: rgba(192, 161, 107, .24); border-color: var(--brass-light); }\n\n.btn-lg  { padding: 17px 34px; font-size: 1.03rem; }\n.btn-sm  { padding: 10px 18px; font-size: .87rem; }\n.btn-full{ width: 100%; }\n.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }\n\n.btn .ico { width: 18px; height: 18px; flex: none; }\n\n/* Textlink mit Pfeil */\n.link-arrow {\n  display: inline-flex; align-items: center; gap: 7px;\n  color: var(--brass-text); font-weight: 700; font-size: .95rem;\n}\n.link-arrow svg { width: 15px; height: 15px; transition: transform .2s ease; }\n.link-arrow:hover svg { transform: translateX(4px); }\n\n/* ---------- 6. Karten & Badges ---------- */\n.card {\n  background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);\n  border: 1px solid var(--line);\n  border-radius: var(--radius-lg);\n  padding: 30px;\n  position: relative;\n  transition: border-color .25s ease, transform .25s ease, box-shadow .25s ease;\n}\n.card-hover:hover {\n  border-color: var(--brass-line);\n  transform: translateY(-4px);\n  box-shadow: var(--shadow);\n}\n.card-pad-sm { padding: 22px; }\n\n.badge {\n  display: inline-flex; align-items: center; gap: 7px;\n  padding: 5px 12px;\n  border-radius: 999px;\n  font-size: .74rem; font-weight: 700;\n  letter-spacing: .04em;\n  border: 1px solid var(--line-strong);\n  background: rgba(255, 255, 255, .04);\n  color: var(--txt-2);\n}\n.badge-accent { border-color: var(--brass-line); background: var(--brass-soft); color: var(--brass-text); }\n.badge-ok   { border-color: rgba(123, 169, 143, .3); background: var(--ok-soft); color: var(--ok); }\n.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }\n.badge .dot-pulse { animation: pulse 2.4s ease-in-out infinite; }\n\n@keyframes pulse {\n  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 currentColor; }\n  50%      { opacity: .55; box-shadow: 0 0 0 5px transparent; }\n}\n\n/* Icon-Kachel */\n.ico-tile {\n  width: 46px; height: 46px;\n  display: grid; place-items: center;\n  border-radius: 13px;\n  background: var(--brass-soft);\n  border: 1px solid var(--brass-line);\n  color: var(--brass-text);\n  flex: none;\n}\n.ico-tile svg { width: 22px; height: 22px; }\n.ico-tile-lg { width: 56px; height: 56px; border-radius: 16px; }\n.ico-tile-lg svg { width: 27px; height: 27px; }\n\n/* Nummerierter Schritt */\n.step-num {\n  width: 42px; height: 42px;\n  display: grid; place-items: center;\n  border-radius: 12px;\n  font-weight: 800; font-size: 1.05rem;\n  background: linear-gradient(140deg, var(--brass-light), var(--brass-deep));\n  color: #14100a;\n  flex: none;\n}\n\n/* ---------- 7. Hintergrund-Effekte ---------- */\n.bg-grid::before {\n  content: \"\";\n  position: absolute; inset: 0;\n  background-image:\n    linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);\n  background-size: 62px 62px;\n  mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 20%, transparent 78%);\n  -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 20%, transparent 78%);\n  pointer-events: none;\n}\n.bg-glow { overflow: hidden; }\n.bg-glow::after {\n  content: \"\";\n  position: absolute;\n  top: -220px; left: 50%;\n  width: min(1100px, 130vw); height: 620px;\n  transform: translateX(-50%);\n  background: radial-gradient(ellipse at center, rgba(192, 161, 107, .17) 0%, transparent 66%);\n  pointer-events: none;\n  filter: blur(10px);\n}\n.divider { height: 1px; background: linear-gradient(90deg, transparent, var(--line-strong), transparent); }\n\n/* ---------- 8. Header / Navigation ---------- */\n.header {\n  position: fixed;\n  inset: 0 0 auto 0;\n  height: var(--header-h);\n  z-index: 100;\n  display: flex; align-items: center;\n  transition: background .3s ease, border-color .3s ease, backdrop-filter .3s ease;\n  border-bottom: 1px solid transparent;\n}\n.header.is-stuck {\n  background: rgba(11, 11, 13, .86);\n  backdrop-filter: blur(16px) saturate(150%);\n  -webkit-backdrop-filter: blur(16px) saturate(150%);\n  border-bottom-color: var(--line);\n}\n.header .wrap { display: flex; align-items: center; gap: 26px; }\n\n.brand { display: flex; align-items: center; gap: 12px; flex: none; }\n.brand-mark { width: auto; height: 42px; flex: none; }\n.brand-wort { width: auto; height: 27px; flex: none; }\n.brand-gross .brand-mark { height: 56px; }\n.brand-gross .brand-wort { height: 34px; }\n\n.nav { display: flex; align-items: center; gap: 4px; margin-left: auto; }\n.nav a {\n  padding: 9px 11px;\n  border-radius: 9px;\n  font-size: .9rem; font-weight: 600;\n  color: var(--txt-2);\n  white-space: nowrap;\n  transition: color .18s ease, background .18s ease;\n}\n.nav a:hover, .nav a.is-active { color: var(--txt); background: rgba(255,255,255,.06); }\n.header-cta { display: flex; align-items: center; gap: 10px; flex: none; }\n\n.burger {\n  display: none;\n  width: 42px; height: 42px;\n  border: 1px solid var(--line-strong);\n  border-radius: 11px;\n  background: rgba(255,255,255,.04);\n  place-items: center;\n  flex: none;\n}\n.burger span {\n  display: block; width: 17px; height: 2px; border-radius: 2px;\n  background: var(--txt);\n  transition: transform .25s ease, opacity .2s ease;\n}\n.burger span + span { margin-top: 4px; }\n.burger[aria-expanded=\"true\"] span:nth-child(1) { transform: translateY(6px) rotate(45deg); }\n.burger[aria-expanded=\"true\"] span:nth-child(2) { opacity: 0; }\n.burger[aria-expanded=\"true\"] span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }\n\n.mobile-nav {\n  position: fixed;\n  inset: var(--header-h) 0 0 0;\n  z-index: 99;\n  background: rgba(11, 11, 13, .97);\n  backdrop-filter: blur(20px);\n  -webkit-backdrop-filter: blur(20px);\n  padding: 26px 22px 40px;\n  display: none;\n  flex-direction: column;\n  gap: 6px;\n  overflow-y: auto;\n  overscroll-behavior: contain;\n}\n.mobile-nav.is-open { display: flex; }\n.mobile-nav a {\n  padding: 15px 14px;\n  border-radius: 12px;\n  font-size: 1.1rem; font-weight: 700;\n  border-bottom: 1px solid var(--line);\n}\n.mobile-nav a:active { background: rgba(255,255,255,.05); }\n.mobile-nav .btn { margin-top: 18px; }\nbody.nav-open { overflow: hidden; }\n\n/* ---------- 9. Hero ---------- */\n.hero {\n  position: relative;\n  padding-top: calc(var(--header-h) + clamp(42px, 6vw, 80px));\n  padding-bottom: clamp(56px, 7vw, 96px);\n  overflow: hidden;\n  background:\n    radial-gradient(ellipse 78% 58% at 12% -8%, rgba(192, 161, 107, .16), transparent 58%),\n    radial-gradient(ellipse 62% 52% at 92% 8%, rgba(192, 161, 107, .07), transparent 60%),\n    var(--bg);\n}\n.hero-inner {\n  display: grid;\n  grid-template-columns: minmax(0, 1.02fr) minmax(0, .98fr);\n  gap: clamp(32px, 5vw, 60px);\n  align-items: start;\n  position: relative;\n  z-index: 2;\n}\n.hero h1 { margin-top: 20px; }\n.hero .lead { margin-top: 22px; max-width: 33em; }\n.hero-actions { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 32px; }\n\n.hero-usp { display: grid; gap: 13px; margin-top: 34px; }\n.hero-usp li { display: flex; align-items: flex-start; gap: 11px; font-size: .97rem; color: var(--txt-2); }\n.hero-usp svg { width: 19px; height: 19px; color: var(--brass-text); flex: none; margin-top: 2px; }\n.hero-usp strong { color: var(--txt); font-weight: 700; }\n\n/* Vertrauens-Leiste */\n.trustbar {\n  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 26px;\n  margin-top: 40px; padding-top: 26px;\n  border-top: 1px solid var(--line);\n}\n.trustbar-label { font-size: .74rem; letter-spacing: .16em; text-transform: uppercase; color: var(--txt-3); font-weight: 700; }\n\n/* ---------- 10. PV-Rechner ---------- */\n.calc {\n  background: linear-gradient(175deg, var(--surface-2) 0%, var(--surface) 60%, #0d1117 100%);\n  border: 1px solid var(--line-strong);\n  border-radius: var(--radius-lg);\n  box-shadow: var(--shadow-lg);\n  overflow: hidden;\n  position: relative;\n}\n.calc::before {\n  content: \"\";\n  position: absolute; inset: 0;\n  border-radius: inherit;\n  padding: 1px;\n  background: linear-gradient(160deg, rgba(192, 161, 107, .38), transparent 42%, transparent 62%, rgba(192, 161, 107, .14));\n  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n  -webkit-mask-composite: xor;\n  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n  mask-composite: exclude;\n  pointer-events: none;\n}\n.calc-head {\n  padding: 22px 26px 18px;\n  border-bottom: 1px solid var(--line);\n  background: rgba(255,255,255,.02);\n}\n.calc-head h3 { font-size: 1.22rem; }\n.calc-head p { font-size: .89rem; color: var(--txt-2); margin-top: 5px; }\n\n.calc-progress { display: flex; gap: 5px; margin-top: 16px; }\n.calc-progress i {\n  height: 3px; flex: 1;\n  border-radius: 3px;\n  background: rgba(255,255,255,.1);\n  transition: background .35s ease;\n}\n.calc-progress i.done { background: linear-gradient(90deg, var(--brass-light), var(--brass)); }\n\n.calc
