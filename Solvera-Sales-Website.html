<style>
  :root {
    --bg: #0b0b0d; --bar: #151518;
    --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
    --txt: #f5f4f2; --txt-2: #8a8781; --brass: #c0a16b;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--txt); font-family: var(--font);
         display: flex; flex-direction: column; overflow: hidden; }

  .leiste { flex: none; display: flex; align-items: center; gap: 18px;
            padding: 0 14px; height: 52px; background: var(--bar);
            border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .leiste::-webkit-scrollbar { display: none; }
  .leiste[hidden] { display: none; }
  .marke { display: flex; align-items: center; gap: 9px; flex: none; }
  .marke img { height: 26px; width: auto; }
  .marke span { font-size: .8rem; font-weight: 700; white-space: nowrap; }
  .hinweis { font-size: .78rem; color: var(--txt-2); white-space: nowrap; flex: none; }
  .geraete { display: flex; gap: 3px; margin-left: auto; flex: none; padding-left: 14px; }
  .geraete button { font: inherit; font-size: .78rem; font-weight: 600; color: var(--txt-2);
                    background: none; border: 1px solid transparent; padding: 6px 11px;
                    border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .geraete button:hover { color: var(--txt); }
  .geraete button[aria-pressed="true"] { color: var(--brass); border-color: var(--line-2); }
  button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .buehne { flex: 1; min-height: 0; display: flex; justify-content: center;
            background: var(--bg); padding: 0; transition: padding .25s ease; }
  .buehne.gerahmt { padding: 22px 16px; }
  .rahmen { width: 100%; height: 100%; max-width: none; background: var(--bg);
            transition: max-width .25s ease; }
  .buehne.gerahmt .rahmen { border: 1px solid var(--line-2); border-radius: 16px;
                            overflow: hidden; box-shadow: 0 30px 70px -30px rgba(0,0,0,.9); }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }

  @media (max-width: 760px) { .marke span, .hinweis { display: none; } .geraete { display: none; } }
</style>
</head>

p(32px,5vw,60px);align-items:center\">\n      <div class=\"reveal\">\n        <span class=\"eyebrow\">Vergütung<\/span>\n        <h2 class=\"mt-16\">70 € je Lead, <span class=\"grad-text\">ohne Obergrenze<\/span><\/h2>\n        <p class=\"lead mt-24\">\n          Ein Satz, keine Staffelung, keine Zielvorgabe. Auszahlung monatlich,\n          wöchentliche Abschläge auf Anfrage.\n        <\/p>\n        <ul class=\"check-list mt-32\">\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span><strong>Keine Obergrenze<\/strong> – mehr Leads bedeuten unmittelbar mehr Provision.<\/span><\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span><strong>Keine Zielvorgabe<\/strong> – die Auszahlung ist an kein Mindestergebnis gebunden.<\/span><\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span><strong>Kein Abschlussrisiko<\/strong> – vergütet wird der Termin, nicht der Verkauf.<\/span><\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span><strong>Keine Stornohaftung<\/strong> – ein späterer Widerruf kostet Sie nichts.<\/span><\/li>\n        <\/ul>\n      <\/div>\n\n      <div class=\"calc reveal reveal-d1\">\n        <div class=\"calc-head\">\n          <h3>Vergütungsrechner<\/h3>\n          <p>Zwei Regler, ein Ergebnis.<\/p>\n        <\/div>\n        <div class=\"calc-body\">\n          <div class=\"slider-wrap\" style=\"margin-top:0\">\n            <div class=\"slider-val\"><span id=\"e-leads\">3<\/span><span>Leads pro Einsatztag<\/span><\/div>\n            <label class=\"tiny\" for=\"earn-leads\" style=\"position:absolute;left:-9999px\">Leads pro Einsatztag<\/label>\n            <input type=\"range\" id=\"earn-leads\" min=\"1\" max=\"15\" step=\"1\" value=\"3\">\n            <div class=\"slider-scale\"><span>1<\/span><span>15<\/span><\/div>\n          <\/div>\n\n          <div class=\"slider-wrap\">\n            <div class=\"slider-val\"><span id=\"e-days\">15<\/span><span>Einsatztage pro Monat<\/span><\/div>\n            <label class=\"tiny\" for=\"earn-days\" style=\"position:absolute;left:-9999px\">Einsatztage pro Monat<\/label>\n            <input type=\"range\" id=\"earn-days\" min=\"4\" max=\"24\" step=\"1\" value=\"15\">\n            <div class=\"slider-scale\"><span>4<\/span><span>24<\/span><\/div>\n          <\/div>\n\n          <div class=\"result-hero mt-24\">\n            <div class=\"label\">Vergütung pro Monat<\/div>\n            <div class=\"value\"><span id=\"e-month\">3.150<\/span> €<\/div>\n            <div class=\"sub\"><span id=\"e-leadcount\">45<\/span> qualifizierte Leads × 70 €<\/div>\n          <\/div>\n\n          <div class=\"result-grid\">\n            <div class=\"result-cell\"><div class=\"k\">Je Einsatztag<\/div><div class=\"v\"><span id=\"e-day\">210<\/span> <span class=\"u\">€<\/span><\/div><\/div>\n            <div class=\"result-cell\"><div class=\"k\">Auf zwölf Monate<\/div><div class=\"v\"><span id=\"e-year\">37.800<\/span> <span class=\"u\">€<\/span><\/div><\/div>\n          <\/div>\n\n          <p class=\"result-note\">\n            Beispielrechnung ohne Zusage einer bestimmten Vergütungshöhe. Steuern und Abgaben sind\n            nicht berücksichtigt.\n          <\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===================== RAHMENBEDINGUNGEN ===================== -->\n<section class=\"section section-alt\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Rahmenbedingungen<\/span>\n      <h2>Konditionen im Überblick<\/h2>\n    <\/div>\n\n    <div class=\"grid g-3\">\n      <article class=\"card card-hover reveal\">\n        <h3>Abrechnung<\/h3>\n        <p class=\"muted mt-8\">Monatliche Auszahlung, wöchentliche Abschläge auf Anfrage.<\/p>\n      <\/article>\n      <article class=\"card card-hover reveal reveal-d1\">\n        <h3>Keine Stornohaftung<\/h3>\n        <p class=\"muted mt-8\">Ein späterer Widerruf des Kunden führt zu keiner Rückforderung.<\/p>\n      <\/article>\n      <article class=\"card card-hover reveal reveal-d2\">\n        <h3>Vertragsverhältnis<\/h3>\n        <p class=\"muted mt-8\">Selbstständig auf Provisionsbasis mit Kleingewerbe. Bei Anmeldung und Steuerberatung unterstützen wir Sie.<\/p>\n      <\/article>\n      <article class=\"card card-hover reveal\">\n        <h3>Ausstattung<\/h3>\n        <p class=\"muted mt-8\">Arbeitskleidung und Geschäftsausstattung werden gestellt. Keine Startgebühr, keine Kaution.<\/p>\n      <\/article>\n      <article class=\"card card-hover reveal reveal-d1\">\n        <h3>Arbeitszeit<\/h3>\n        <p class=\"muted mt-8\">Einsatztage teilen Sie sich selbst ein. Verbindlich sind vereinbarte Kundentermine.<\/p>\n      <\/article>\n      <article class=\"card card-hover reveal reveal-d2\">\n        <h3>Voraussetzungen<\/h3>\n        <p class=\"muted mt-8\">Mindestalter 18 Jahre. Führerschein und Fahrzeug von Vorteil, aber keine Bedingung.<\/p>\n      <\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===================== ENTWICKLUNG ===================== -->\n<section class=\"section\" id=\"aufstieg\">\n  <div class=\"wrap\">\n    <div class=\"grid g-2\" style=\"gap:clamp(32px,5vw,60px);align-items:start\">\n      <div class=\"reveal\">\n        <span class=\"eyebrow\">Entwicklung<\/span>\n        <h2 class=\"mt-16\">Drei Stufen<\/h2>\n        <p class=\"lead mt-24\">\n          Maßgeblich sind Ergebnisse, nicht die Dauer der Zusammenarbeit.\n        <\/p>\n        <div class=\"card card-pad-sm mt-32\" style=\"background:var(--krone-soft);border-color:var(--krone-line)\">\n          <h4>Führungsaufgaben<\/h4>\n          <p class=\"small muted mt-8\">\n            Mit dem weiteren Ausbau entstehen neue Positionen als Mentor und in der Teamleitung.\n            Vermerken Sie Ihr Interesse im Formular.\n          <\/p>\n          <a class=\"btn btn-primary btn-full mt-16\" href=\"#formular\">Interesse vermerken<\/a>\n        <\/div>\n      <\/div>\n\n      <div class=\"timeline reveal reveal-d1\">\n        <div class=\"timeline-item\">\n          <h4>Stufe 1 · Vertriebspartner<\/h4>\n          <p>Gespräche im zugeteilten Gebiet, Termine vereinbaren. Ein Mentor begleitet die Einarbeitung.<\/p>\n          <p class=\"small mt-8\"><strong class=\"accent\">70 €<\/strong> <span class=\"muted\">je qualifiziertem Lead<\/span><\/p>\n        <\/div>\n        <div class=\"timeline-item\">\n          <h4>Stufe 2 · Mentor<\/h4>\n          <p>Sie arbeiten neue Vertriebspartner ein und begleiten sie im Außendienst.<\/p>\n          <p class=\"small mt-8\"><strong class=\"accent\">Eigene Leads plus Beteiligung<\/strong> <span class=\"muted\">am Ergebnis der betreuten Kollegen<\/span><\/p>\n        <\/div>\n        <div class=\"timeline-item ist-krone\">\n          <h4><svg viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\" class=\"krone-inline\"><path d=\"M3 8.5a1.3 1.3 0 1 1 2.1 1l1.9 3.1 3-4.2a1.4 1.4 0 1 1 2 0l3 4.2 1.9-3.1a1.3 1.3 0 1 1 2.1-1c0 .6-.4 1.1-.9 1.2L19.6 18H4.4L3.9 9.7c-.5-.1-.9-.6-.9-1.2ZM4.9 19.4h14.2v1.4H4.9z\"/><\/svg>Stufe 3 · Teamleitung<\/h4>\n          <p>Personalauswahl, Ausbildung, Gebietsplanung und Ergebnis eines Standorts.<\/p>\n          <p class=\"small mt-8\"><strong class=\"accent\">Standortverantwortung<\/strong> <span class=\"muted\">· höchste Stufe<\/span><\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===================== STANDORTE ===================== -->\n<section class=\"section section-alt\" id=\"standorte\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Standorte<\/span>\n      <h2>Offene Positionen<\/h2>\n      <p class=\"lead\">Ausbildung in Karlsruhe, Einsatz am gewählten Standort.<\/p>\n    <\/div>\n\n    <div class=\"loc-grid\">\n      <article class=\"loc reveal\">\n        <div class=\"loc-head\"><h3>Baden-Württemberg<\/h3><span class=\"badge badge-ok\"><i class=\"dot\"><\/i> Aktiv<\/span><\/div>\n        <ul class=\"loc-list mt-16\">\n          <li>: <strong>Monis Manai<\/strong><\/li>\n          <li> (m/w/d)<\/li>\n          <li> (m/w/d) bei Qualifikation<\/li>\n        <\/ul>\n      <\/article>\n      <article class=\"loc reveal reveal-d1\">\n        <div class=\"loc-head\"><h3>Berlin<\/h3><span class=\"badge badge-accent\"><i class=\"dot dot-pulse\"><\/i> Im Aufbau<\/span><\/div>\n        <ul class=\"loc-list mt-16\">\n          <li>: <strong>Marc Naccum<\/strong><\/li>\n          <li> (m/w/d)<\/li>\n          <li> ab sofort<\/li>\n        <\/ul>\n      <\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===================== AUSBILDUNG & ABLAUF ===================== -->\n<section class=\"section\" id=\"ausbildung\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Ausbildung<\/span>\n      <h2>Kostenfreie Ausbildung in Karlsruhe<\/h2>\n      <p class=\"lead\">Termine nach Absprache, Ausbildung immer in der Gruppe.<\/p>\n    <\/div>\n\n    <div class=\"grid g-3\">\n      <article class=\"card card-hover reveal\">\n        <div class=\"step-num\">1<\/div>\n        <h3 class=\"mt-24\">Fachliche Grundlagen<\/h3>\n        <p class=\"muted mt-8\">Anlage, Speicher, Wärmepumpe, Einspeisevergütung und steuerliche Behandlung.<\/p>\n      <\/article>\n      <article class=\"card card-hover reveal reveal-d1\">\n        <div class=\"step-num\">2<\/div>\n        <h3 class=\"mt-24\">Gesprächsführung<\/h3>\n        <p class=\"muted mt-8\">Einstieg, Bedarfsermittlung, Einwandbehandlung, Terminvereinbarung – überwiegend praktisch.<\/p>\n      <\/article>\n      <article class=\"card card-hover reveal reveal-d2\">\n        <div class=\"step-num\">3<\/div>\n        <h3 class=\"mt-24\">Praxistag<\/h3>\n        <p class=\"muted mt-8\">Begleiteter Einsatz im Gebiet mit Ihrem Mentor.<\/p>\n      <\/article>\n    <\/div>\n\n    <div class=\"card mt-32 reveal\" style=\"padding:clamp(28px,4vw,44px)\">\n      <div class=\"grid g-2\" style=\"gap:38px;align-items:center\">\n        <div>\n          <h3>Formalitäten übernehmen wir<\/h3>\n          <p class=\"muted mt-16\">Sie müssen sich um nichts allein kümmern.<\/p>\n        <\/div>\n        <ul class=\"check-list\">\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span><strong>Gewerbeanmeldung<\/strong> – Verfahren und zuständige Stellen.<\/span><\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span><strong>Steuerberatung<\/strong> – auf Wunsch vermitteln wir eine Kanzlei.<\/span><\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span><strong>Abrechnung<\/strong> – nachvollziehbare Aufstellung Ihrer Leads.<\/span><\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span><strong>Ausstattung<\/strong> – Arbeitskleidung und Geschäftsausstattung.<\/span><\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-head center reveal mt-48\" style=\"margin-bottom:34px\">\n      <span class=\"eyebrow\" style=\"justify-content:center\">Ablauf<\/span>\n      <h2>In zwei Wochen im Einsatz<\/h2>\n    <\/div>\n    <div class=\"process\">\n      <div class=\"process-item reveal\"><div class=\"step-num\">1<\/div><h4>Bewerbung<\/h4><p>Formular oder WhatsApp. Zeugnisse sind nicht erforderlich.<\/p><\/div>\n      <div class=\"process-item reveal reveal-d1\"><div class=\"step-num\">2<\/div><h4>Kennenlernen<\/h4><p>Kurzes Telefonat oder Gespräch am Standort.<\/p><\/div>\n      <div class=\"process-item reveal reveal-d2\"><div class=\"step-num\">3<\/div><h4>Ausbildung<\/h4><p>Kostenfreie Einarbeitung in Karlsruhe.<\/p><\/div>\n      <div class=\"process-item reveal reveal-d3\"><div class=\"step-num\">4<\/div><h4>Erster Einsatz<\/h4><p>Gebiet zugeteilt, Mentor an Ihrer Seite.<\/p><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===================== FORMULAR ===================== -->\n<section class=\"section bg-glow\" id=\"formular\">\n  <div class=\"wrap wrap-narrow\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Formular<\/span>\n      <h2>Bewerbung übermitteln<\/h2>\n      <p class=\"lead\">Mit <span class=\"accent\">*<\/span> gekennzeichnete Felder sind Pflichtfelder.<\/p>\n    <\/div>\n\n    <div class=\"card reveal\" style=\"padding:clamp(26px,4vw,42px)\">\n      <form id=\"form-bewerbung\" data-form=\"bewerbung\" novalidate>\n        <div class=\"form-grid\">\n          <div class=\"field\">\n            <label for=\"b-vorname\">Vorname <span class=\"req\">*<\/span><\/label>\n            <input class=\"input\" type=\"text\" id=\"b-vorname\" name=\"vorname\" autocomplete=\"given-name\" placeholder=\"Max\" required>\n            <span class=\"field-err\">Bitte geben Sie Ihren Vornamen an.<\/span>\n          <\/div>\n          <div class=\"field\">\n            <label for=\"b-nachname\">Nachname <span class=\"req\">*<\/span><\/label>\n            <input class=\"input\" type=\"text\" :space-between;gap:20px;flex-wrap:wrap\">\n      <div>\n        <h4>Rückfragen vorab?<\/h4>\n        <p class=\"small muted\">Schreiben Sie uns kurz – wir antworten auch abends.<\/p>\n      <\/div>\n      <a class=\"wa-btn\" href=\"https://wa.me/4917645163460?text=Guten%20Tag%2C%20ich%20interessiere%20mich%20f%C3%BCr%20eine%20T%C3%A4tigkeit%20als%20Vertriebspartner%20bei%20der%20Solvera%20Sales%20GmbH.\" target=\"_blank\" rel=\"noopener\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35z\"/><path d=\"M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.15h-.01a8.23 8.23 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.83 2.42a8.19 8.19 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23z\"/><\/svg> WhatsApp<\/a>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===================== FAQ ===================== -->\n<section class=\"section section-alt\" id=\"faq\">\n  <div class=\"wrap wrap-narrow\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Häufige Fragen<\/span>\n      <h2>Kurz beantwortet<\/h2>\n    <\/div>\n\n    <div class=\"faq\">\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\" type=\"button\">Ist Vertriebserfahrung erforderlich?\n          <svg class=\"faq-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n        <\/button>\n        <div class=\"faq-a\"><div><p>Nein. Rund die Hälfte unserer Vertriebspartner sind Quereinsteiger. Das Fachliche vermitteln wir in der Ausbildung.<\/p><\/div><\/div>\n      <\/div>\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\" type=\"button\">Wie hoch ist die Vergütung?\n          <svg class=\"faq-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n        <\/button>\n        <div class=\"faq-a\"><div><p>70 € je qualifiziertem Lead, ohne Obergrenze und ohne Stornohaftung. Mit dem Rechner weiter oben können Sie verschiedene Szenarien durchspielen.<\/p><p>Eine bestimmte Vergütungshöhe wird nicht zugesagt – sie hängt von Ihrem Einsatz ab.<\/p><\/div><\/div>\n      <\/div>\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\" type=\"button\">Welche Voraussetzungen bestehen?\n          <svg class=\"faq-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n        <\/button>\n        <div class=\"faq-a\"><div><p>Mindestalter 18 Jahre. Führerschein und Fahrzeug sind von Vorteil, aber keine Bedingung. Ein bestimmter Abschluss wird nicht verlangt.<\/p><\/div><\/div>\n      <\/div>\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\" type=\"button\">Handelt es sich um ein Anstellungsverhältnis?\n          <svg class=\"faq-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n        <\/button>\n        <div class=\"faq-a\"><div><p>Nein, die Tätigkeit erfolgt selbstständig auf Provisionsbasis mit Kleingewerbe. Bei Anmeldung, Steuerberatung und Abrechnung unterstützen wir Sie.<\/p><\/div><\/div>\n      <\/div>\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\" type=\"button\">Was gilt bei einem späteren Widerruf des Kunden?\n          <svg class=\"faq-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n        <\/button>\n        <div class=\"faq-a\"><div><p>Ihre Vergütung bleibt bestehen. Es gibt keine Stornohaftung und keine Rückforderung.<\/p><\/div><\/div>\n      <\/div>\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\" type=\"button\">Wann erfolgt die Auszahlung?\n          <svg class=\"faq-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n        <\/button>\n        <div class=\"faq-a\"><div><p>Monatlich. Wöchentliche Abschläge sind auf Anfrage über die Teamleitung möglich.<\/p><\/div><\/div>\n      <\/div>\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\" type=\"button\">Wann und wo ist ein Einstieg möglich?\n          <svg class=\"faq-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n        <\/button>\n        <div class=\"faq-a\"><div><p>Der Termin wird individuell abgestimmt. Die Ausbildung findet in Karlsruhe statt, der Einsatz anschließend in Baden-Württemberg oder Berlin.<\/p><\/div><\/div>\n      <\/div>\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\" type=\"button\">Entstehen Kosten für die Ausbildung?\n          <svg class=\"faq-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n        <\/button>\n        <div class=\"faq-a\"><div><p>Nein. Ausbildung, Mentorenbetreuung und Ausstattung sind kostenfrei. Es gibt weder Startgebühr noch Kaution.<\/p><\/div><\/div>\n      <\/div>\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\" type=\"button\">Ist eine nebenberufliche Tätigkeit möglich?\n          <svg class=\"faq-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n        <\/button>\n        <div class=\"faq-a\"><div><p>Ja. Die Einsatztage teilen Sie sich selbst ein. Verbindlich sind allein zugesagte Kundentermine.<\/p><\/div><\/div>\n      <\/div>\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\" type=\"button\">Wie ist ein Einsatztag strukturiert?\n          <svg class=\"faq-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n        <\/button>\n        <div class=\"faq-a\"><div><p>Sie sind in einem zugeteilten Gebiet unterwegs, sprechen Eigentümer an und vereinbaren Beratungstermine. Mit der Dokumentation des Termins ist Ihr Lead vollständig.<\/p><\/div><\/div>\n      <\/div>\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\" type=\"button\">Wie verläuft das Bewerbungsverfahren?\n          <svg class=\"faq-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n        <\/button>\n        <div class=\"faq-a\"><div><p>Rückmeldung innerhalb von 48 Stunden, danach ein kurzes Kennenlerngespräch. Ein Motivationsschreiben ist nicht erforderlich.<\/p><\/div><\/div>\n      <\/div>\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\" type=\"button\">Ist eine Bewerbung auf die Teamleitung möglich?\n          <svg class=\"faq-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n        <\/button>\n        <div class=\"faq-a\"><div><p>Beide Standorte sind derzeit besetzt. Mit dem weiteren Ausbau entstehen neue Positionen – wählen Sie im Formular unter Vertriebserfahrung „Interesse an einer Führungsaufgabe\".<\/p><\/div><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n\n<footer class=\"footer\">\n  <div class=\"wrap\">\n    <div class=\"footer-top\">\n      <div class=\"footer-about\">\n        <a class=\"brand brand-gross\" href=\"index.html\">\n          <img class=\"brand-mark\" src=\"%SOLVERA_IMG:logo-mark.png%\" alt=\"\" width=\"240\" height=\"331\">\n          <img class=\"brand-wort\" src=\"%SOLVERA_IMG:logo-wortmarke.png%\" alt=\"Solvera Sales\" width=\"620\" height=\"154\">\n        <\/a>\n        <p>\n          Vertriebsdienstleister für die Photovoltaik-Branche. Wir gewinnen qualifizierte\n          Kundenkontakte für Fachbetriebe und bilden Vertriebspartner in Baden-Württemberg und Berlin aus.\n        <\/p>\n        <!-- Symbole erscheinen automatisch, sobald in assets/js/config.js\n             unter \"social\" eine Profil-URL hinterlegt ist. -->\n        <div class=\"social-row\" data-social><\/div>\n      <\/div>\n\n      <div>\n        <h5>Für Bewerber<\/h5>\n        <nav class=\"footer-links\">\n          <a href=\"bewerben.html#verguetung\">Vergütung<\/a>\n          <a href=\"bewerben.html#aufstieg\">Entwicklung<\/a>\n          <a href=\"bewerben.html#formular\">Jetzt bewerben<\/a>\n          <a href=\"bewerben.html#faq\">Häufige Fragen<\/a>\n        <\/nav>\n      <\/div>\n\n      <div>\n        <h5>Unternehmen<\/h5>\n        <nav class=\"footer-links\">\n          <a href=\"ueber-uns.html\">Über uns<\/a>\n          <a href=\"ueber-uns.html#standorte\">Standorte<\/a>\n          <a href=\"photovoltaik.html\">Photovoltaik &amp; Förderung<\/a>\n          <a href=\"photovoltaik-firmen.html\">Firmenkunden<\/a>\n        <\/nav>\n      <\/div>\n\n      <div>\n        <h5>Kontakt<\/h5>\n        <nav class=\"footer-links\">\n          <a href=\"bewerben.html\">Jetzt bewerben<\/a>\n          <a href=\"mailto:info@solvera-sales.de\">info@solvera-sales.de<\/a>\n          <span class=\"small muted\" style=\"line-height:1.6\">Wachhausstraße 14d<br>76227 Karlsruhe<\/span>\n        <\/nav>\n      <\/div>\n    <\/div>\n\n    <div class=\"footer-bottom\">\n      <span>© <span data-year>2026<\/span> Solvera Sales GmbH. Alle Rechte vorbehalten.<\/span>\n      <nav>\n        <a href=\"impressum.html\">Impressum<\/a>\n        <a href=\"datenschutz.html\">Datenschutz<\/a>\n        <a href=\"#\" data-consent-reset>Cookie-Einstellungen<\/a>\n      <\/nav>\n    <\/div>\n  <\/div>\n<\/footer>\n\n<button class=\"to-top\" id=\"to-top\" aria-label=\"Nach oben scrollen\">\n  <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 19V5M5 12l7-7 7 7\"/><\/svg>\n<\/button>\n\n<!--SOLVERA:JS:config.js-->\n<!--SOLVERA:JS:consent.js-->\n<!--SOLVERA:JS:main.js-->\n<!--SOLVERA:JS:forms.js-->\n<!--SOLVERA:JS:earnings.js-->\n\n<script>\n(function () {\n  document.addEventListener('click', function (e) {\n    var a = e.target.closest && e.target.closest('a[href$=\".html\"]');\n    if (!a) return;\n    e.preventDefault();\n    var h = a.getAttribute('href');\n    parent.postMessage({ solveraSeite: h.split('/').pop().split('#')[0],\n                         anker: (h.split('#')[1] || '') }, '*');\n  });\n})();\n<\/script>\n<\/body>\n<\/html>\n", "photovoltaik.html": "<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Photovoltaik: Vorteile, Förderung &amp; Leads | Solvera Sales GmbH<\/title>\n<meta name=\"description\" content=\"Warum sich Photovoltaik lohnt: Vorteile für Hausbesitzer, staatliche Förderung, Bedeutung für Umwelt und Wirtschaft. Dazu der kostenlose Photovoltaik-Rechner.\">\n<meta name=\"robots\" content=\"index, follow\">\n<meta name=\"theme-color\" content=\"#0b0b0d\">\n<link rel=\"canonical\" href=\"https://www.solvera-sales.de/photovoltaik.html\">\n\n<meta property=\"og:type\" content=\"website\">\n<meta property=\"og:locale\" content=\"de_DE\">\n<meta property=\"og:site_name\" content=\"Solvera Sales GmbH\">\n<meta property=\"og:title\" content=\"Photovoltaik: Vorteile, Förderung &amp; Leads | Solvera Sales GmbH\">\n<meta property=\"og:description\" content=\"Warum sich Photovoltaik lohnt: Vorteile für Hausbesitzer, staatliche Förderung, Bedeutung für Umwelt und Wirtschaft. Dazu der kostenlose Photovoltaik-Rechner.\">\n<meta property=\"og:url\" content=\"https://www.solvera-sales.de/photovoltaik.html\">\n<meta name=\"twitter:card\" content=\"summary_large_image\">\n\n<link rel=\"icon\" href=\"%SOLVERA_IMG:favicon-32.png%\" sizes=\"32x32\" type=\"image/png\">\n<link rel=\"apple-touch-icon\" href=\"%SOLVERA_IMG:favicon-180.png%\">\n<!--SOLVERA:CSS-->\n<\/head>\n<body>\n<a class=\"skip\" href=\"#main\">Zum Inhalt springen<\/a>\n\n<header class=\"header\" id=\"header\">\n  <div class=\"wrap\">\n    <a class=\"brand\" href=\"index.html\" aria-label=\"Solvera Sales GmbH – Startseite\">\n      <img class=\"brand-mark\" src=\"%SOLVERA_IMG:logo-mark.png%\" alt=\"\" width=\"240\" height=\"331\">\n      <img class=\"brand-wort\" src=\"%SOLVERA_IMG:logo-wortmarke.png%\" alt=\"Solvera Sales\" width=\"620\" height=\"154\">\n    <\/a>\n\n    <nav class=\"nav\" aria-label=\"Hauptnavigation\">\n      <a href=\"index.html\">Start<\/a>\n      <a href=\"bewerben.html\" class=\"nav-cta\">Bewerben<\/a>\n      <a href=\"photovoltaik.html\" class=\"is-active\">Photovoltaikanlage<\/a>\n      <a href=\"photovoltaik-firmen.html\">Firmenkunden<\/a>\n      <a href=\"ueber-uns.html\">Über uns<\/a>\n    <\/nav>\n\n    <div class=\"header-cta\">\n      <a class=\"btn btn-primary btn-sm nur-mobil\" href=\"bewerben.html\">Bewerben<\/a>\n      <button class=\"burger\" id=\"burger\" aria-label=\"Menü öffnen\" aria-expanded=\"false\" aria-controls=\"mobile-nav\">\n        <span><\/span><span><\/span><span><\/span>\n      <\/button>\n    <\/div>\n  <\/div>\n<\/header>\n\n<nav class=\"mobile-nav\" id=\"mobile-nav\" aria-label=\"Mobile Navigation\">\n  <a href=\"index.html\">Start<\/a>\n  <a href=\"bewerben.html\">Bewerben<\/a>\n  <a href=\"photovoltaik.html\">Photovoltaikanlage<\/a>\n  <a href=\"photovoltaik-firmen.html\">Firmenkunden<\/a>\n  <a href=\"ueber-uns.html\">Über uns<\/a>\n  <a class=\"btn btn-primary btn-full btn-lg\" href=\"bewerben.html\">Jetzt bewerben<\/a>\n<\/nav>\n\n<main id=\"main\">\n\n<!-- ===================== HERO ===================== -->\n<section class=\"hero bg-grid\">\n  <div class=\"wrap\">\n    <div style=\"max-width:900px\">\n      <span class=\"eyebrow\">Photovoltaik<\/span>\n      <h1 class=\"mt-16\">Photovoltaik: <span class=\"grad-text\">Vorteile, Förderung, Marktlage.<\/span><\/h1>\n      <p class=\"lead mt-24\" style=\"max-width:40em\">\n        Gesetzlich gefördert, steuerlich begünstigt, über zwanzig Jahre planbar.\n      <\/p>\n      <div class=\"hero-actions\">\n        <a class=\"btn btn-primary btn-lg\" href=\"bewerben.html\">Jetzt bewerben<\/a>\n        <a class=\"btn btn-ghost btn-lg\" href=\"#rechner\">Ersparnis berechnen<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===================== VORTEILE FÜR HAUSBESITZER ===================== -->\n<section class=\"section section-alt\" id=\"vorteile\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Vorteile<\/span>\n      <h2>Warum sich eine Solaranlage lohnt<\/h2>\n      <p class=\"lead\">Jeder Punkt lässt sich im Einzelfall durchrechnen.<\/p>\n    <\/div>\n\n    <div class=\"grid g-3\">\n      <article class=\"card card-hover reveal\">\n        <div class=\"ico-tile ico-tile-lg\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6\"/><\/svg><\/div>\n        <h3 class=\"mt-24\">Niedrigere Stromkosten<\/h3>\n        <p class=\"muted mt-8\">\n          Eigener Solarstrom kostet nach der Anschaffung deutlich weniger als Netzstrom. Mit Speicher steigt der Effekt.\n        <\/p>\n      <\/article>\n\n      <article class=\"card card-hover reveal reveal-d1\">\n        <div class=\"ico-tile ico-tile-lg\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 3v18h18\"/><path d=\"m7 15 4-5 4 3 5-7\"/><\/svg><\/div>\n        <h3 class=\"mt-24\">Planbar über 20 Jahre<\/h3>\n        <p class=\"muted mt-8\">\n          Für eingespeisten Strom besteht ein gesetzlicher Vergütungsanspruch über 20 Jahre plus Inbetriebnahmejahr.\n        <\/p>\n      <\/article>\n\n      <article class=\"card card-hover reveal reveal-d2\">\n        <div class=\"ico-tile ico-tile-lg\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"/><path d=\"M9 22V12h6v10\"/><\/svg><\/div>\n        <h3 class=\"mt-24\">Wertsteigerung der Immobilie<\/h3>\n        <p class=\"muted mt-8\">\n          Bessere Energiebilanz, besserer Energieausweis – ein Vorteil bei Verkauf und Vermietung.\n        <\/p>\n      <\/article>\n\n      <article class=\"card card-hover reveal\">\n        <div class=\"ico-tile ico-tile-lg\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"/><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"/><\/svg><\/div>\n        <h3 class=\"mt-24\">Unabhängigkeit vom Markt<\/h3>\n        <p class=\"muted mt-8\">\n          Wer selbst erzeugt, ist von Preissprüngen am Energiemarkt weniger betroffen.\n        <\/p>\n      <\/article>\n\n      <article class=\"card card-hover reveal reveal-d1\">\n        <div class=\"ico-tile ico-tile-lg\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/><\/svg><\/div>\n        <h3 class=\"mt-24\">Lange Lebensdauer<\/h3>\n        <p class=\"muted mt-8\">\n          Hersteller geben auf Module üblicherweise Leistungsgarantien über 25 Jahre.\n        <\/p>\n      <\/article>\n\n      <article class=\"card card-hover reveal reveal-d2\">\n        <div class=\"ico-tile ico-tile-lg\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><path d=\"M14 2v6h6M9 15h6M9 11h3\"/><\/svg><\/div>\n        <h3 class=\"mt-24\">Ein Ansprechpartner<\/h3>\n        <p class=\"muted mt-8\">\n          Der Fachpartner übernimmt Planung, Anmeldung beim Netzbetreiber, Montage und Inbetriebnahme.\n        <\/p>\n      <\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===================== FÖRDERUNG ===================== -->\n<section class=\"section\" id=\"foerderung\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Staatliche Förderung<\/span>\n      <h2>Der Gesetzgeber macht mit<\/h2>\n      <p class=\"lead\">\n        Photovoltaik ist in Deutschland politisch gewollt und entsprechend gefördert. Diese\n        Regelungen sind ein wesentlicher Grund dafür, dass sich Anlagen heute deutlich schneller\n        rechnen als noch vor einigen Jahren.\n      <\/p>\n    <\/div>\n\n    <div class=\"grid g-2\" style=\"gap:22px\">\n      <article class=\"card reveal\">\n        <span class=\"badge badge-accent\">Umsatzsteuer<\/span>\n        <h3 class=\"mt-16\">0 % beim Kauf<\/h3>\n        <p class=\"muted mt-8\">\n          Für Lieferung und Installation auf Wohngebäuden gilt seit 2023 ein Umsatzsteuersatz von null Prozent (§ 12 Abs. 3 UStG).\n        <\/p>\n      <\/article>\n\n      <article class=\"card reveal reveal-d1\">\n        <span class=\"badge badge-accent\">Einkommensteuer<\/span>\n        <h3 class=\"mt-16\">Einnahmen steuerfrei<\/h3>\n        <p class=\"muted mt-8\">\n          Einnahmen aus Anlagen bis 30 kWp auf Einfamilienhäusern sind einkommensteuerfrei (§ 3 Nr. 72 EStG).\n        <\/p>\n      <\/article>\n\n      <article class=\"card reveal\">\n        <span class=\"badge badge-accent\">EEG<\/span>\n        <h3 class=\"mt-16\">Vergütung über 20 Jahre<\/h3>\n        <p class=\"muted mt-8\">\n          Der Vergütungssatz zum Zeitpunkt der Inbetriebnahme bleibt über die gesamte Laufzeit erhalten.\n        <\/p>\n      <\/article>\n\n      <article class=\"card reveal reveal-d1\">\n        <span class=\"badge badge-accent\">KfW<\/span>\n        <h3 class=\"mt-16\">Zinsgünstige Finanzierung<\/h3>\n        <p class=\"muted mt-8\">\n          Über das KfW-Programm 270 finanzierbar. Viele Bundesländer und Kommunen fördern zusätzlich.\n        <\/p>\n      <\/article>\n\n      <article class=\"card reveal\">\n        <span class=\"badge badge-accent\">Wärmepumpe<\/span>\n        <h3 class=\"mt-16\">Zuschuss aus der BEG<\/h3>\n        <p class=\"muted mt-8\">\n          Beim Heizungstausch ist ein erheblicher Zuschuss möglich. In Kombination mit eigener Anlage sinken die Heizkosten doppelt.\n        <\/p>\n      <\/article>\n\n      <article class=\"card reveal reveal-d1\">\n        <span class=\"badge\">Hinweis<\/span>\n        <h3 class=\"mt-16\">Angaben ohne Gewähr<\/h3>\n        <p class=\"muted mt-8\">\n          Stand: August 2026. Förderbedingungen ändern sich regelmäßig. Verbindliche Auskunft erteilen Fachbetrieb, Förderstelle oder Steuerberater.\n        <\/p>\n      <\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===================== UMWELT UND WIRTSCHAFT ===================== -->\n<section class=\"section section-alt\">\n  <div class=\"wrap\">\n    <div class=\"grid g-2\" style=\"gap:clamp(32px,5vw,60px);align-items:center\">\n      <div class=\"reveal\">\n        <span class=\"eyebrow\">Der größere Zusammenhang<\/span>\n        <h2 class=\"mt-16\">Volkswirtschaftliche Einordnung<\/h2>\n        <p class=\"lead mt-24\">\n          Jede installierte Anlage ersetzt Strom aus konventioneller Erzeugung.\n        <\/p>\n        <ul class=\"check-list mt-32\">\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span><strong>Weniger CO₂<\/strong> – eine typische Anlage vermeidet jährlich mehrere Tonnen gegenüber dem Strommix.<\/span><\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span><strong>Weniger Energieimporte<\/strong> – Strom vom eigenen Dach ersetzt eingekaufte fossile Energie.<\/span><\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span><strong>Handwerk vor Ort<\/strong> – Planung, Installation und Wartung erbringen regionale Betriebe.<\/span><\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span><strong>Gesetzliches Ziel<\/strong> – 80 Prozent erneuerbarer Strom bis 2030.<\/span><\/li>\n        <\/ul>\n      <\/div>\n\n      <div class=\"reveal reveal-d1\">\n        <div class=\"card\" style=\"padding:clamp(28px,4vw,42px)\">\n          <span class=\"eyebrow\">Einordnung<\/span>\n          <p class=\"mt-24\" style=\"font-size:clamp(1.05rem,1.8vw,1.3rem);font-weight:700;letter-spacing:-.02em;line-height:1.5\">\n            Am Ende des Gesprächs steht kein Vertrag, sondern ein Beratungstermin.\n          <\/p>\n          <div class=\"divider\" style=\"margin:28px 0\"><\/div>\n          <p class=\"muted small\">\n            Direktvertrieb bleibt anspruchsvoll – die sachliche Grundlage des Themas erleichtert\n            aber jedes Gespräch.\n          <\/p>\n          <a class=\"btn btn-primary btn-full mt-24\" href=\"bewerben.html\">Jetzt bewerben<\/a>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===================== WAS IST EIN LEAD ===================== -->\n<section class=\"section\" id=\"leads\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Grundbegriff<\/span>\n      <h2>Was ein Photovoltaik-Lead ist – und was nicht<\/h2>\n      <p class=\"lead\">\n        Ein Kontakt mit echtem Interesse und dokumentierter Einwilligung – kein gekaufter Datensatz.\n      <\/p>\n    <\/div>\n\n    <div class=\"card reveal\" style=\"padding:clamp(28px,4vw,44px)\">\n      <div class=\"grid g-2\" style=\"gap:38px;align-items:start\">\n        <div>\n          <h3>Sieben Kriterien, kein Interpretationsspielraum<\/h3>\n          <p class=\"muted mt-16\">\n            Diese Vorgaben stammen von unseren Fachpartnern. Fehlt eines davon, wird der Kontakt\n            nicht weitergegeben und nicht vergütet.\n          <\/p>\n        <\/div>\n        <ul class=\"check-list\">\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span><strong>Eigentümer<\/strong> – Hausbesitzer oder entscheidungsbefugt.<\/span><\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\/svg><span><strong>Dachfläche über 25 m²<\/strong> – Nutzbare Fläche vorhanden.<\/ n Hinweisfenster, in dem Sie entscheiden, ob wir\n      Analyse-Dienste einsetzen dürfen. <strong>Ohne Ihre ausdrückliche Einwilligung wird kein\n      Analyse-Dienst geladen, kein Skript eines Drittanbieters eingebunden und kein\n      Analyse-Cookie gesetzt.<\/strong> Die technisch notwendigen Funktionen der Website – etwa der\n      Photovoltaik-Rechner und die Formulare – funktionieren auch ohne Einwilligung uneingeschränkt.\n    <\/p>\n    <p>\n      Ihre Entscheidung speichern wir im lokalen Speicher Ihres Browsers (Local Storage) unter dem\n      Schlüssel <code>solvera-consent<\/code>. Gespeichert werden ausschließlich die Angabe, ob Sie\n      zugestimmt haben, und der Zeitpunkt der Entscheidung. Nach 182 Tagen läuft die Speicherung ab\n      und Sie werden erneut gefragt. Diese Speicherung ist zur Umsetzung Ihrer Auswahl technisch\n      erforderlich (§ 25 Abs. 2 Nr. 2 TDDDG).\n    <\/p>\n    <p>\n      <strong>Widerruf:<\/strong> Sie können Ihre Einwilligung jederzeit mit Wirkung für die Zukunft\n      widerrufen. Klicken Sie dazu im Seitenfuß auf\n      <a href=\"#\" data-consent-reset>Cookie-Einstellungen<\/a>. Die Auswahl wird zurückgesetzt und Sie\n      können neu entscheiden. Alternativ löschen Sie die Websitedaten in Ihren Browsereinstellungen.\n    <\/p>\n    <p>\n      Rechtsgrundlage für den Einsatz der Analyse-Dienste ist Ihre Einwilligung nach\n      § 25 Abs. 1 TDDDG in Verbindung mit Art. 6 Abs. 1 lit. a DSGVO.\n    <\/p>\n\n    <h2>5. Eingesetzte Analyse-Dienste<\/h2>\n    <div class=\"legal-note\">\n      <strong>Wichtig für den Betrieb:<\/strong> Bitte lassen Sie unter diesem Abschnitt\n      <em>nur<\/em> die Dienste stehen, die in <code>assets/js/config.js<\/code> tatsächlich\n      aktiviert sind. Nicht genutzte Dienste hier ersatzlos streichen – die Nennung eines nicht\n      eingesetzten Dienstes ist genauso fehlerhaft wie das Verschweigen eines eingesetzten.\n    <\/div>\n\n    <h3>Google Analytics 4<\/h3>\n    <p>\n      Anbieter: Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Irland.\n      Google Analytics verwendet Cookies und ähnliche Technologien, um die Nutzung unserer Website\n      auszuwerten – etwa welche Seiten aufgerufen werden, wie lange Besucher bleiben und über welchen\n      Weg sie zu uns gefunden haben. Die IP-Adresse wird gekürzt (IP-Anonymisierung), bevor sie\n      ausgewertet wird.\n    <\/p>\n    <p>\n      Dabei kann es zu einer Übermittlung personenbezogener Daten in die USA kommen. Google LLC ist\n      unter dem EU-US Data Privacy Framework zertifiziert. Weitere Informationen finden Sie in der\n      Datenschutzerklärung von Google:\n      <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\">policies.google.com/privacy<\/a>.\n    <\/p>\n\n    <h3>Meta-Pixel (Facebook &amp; Instagram)<\/h3>\n    <p>\n      Anbieter: Meta Platforms Ireland Limited, 4 Grand Canal Square, Grand Canal Harbour,\n      Dublin 2, Irland. Das Meta-Pixel erfasst, welche Handlungen Besucher auf unserer Website\n      vornehmen, nachdem sie eine unserer Anzeigen gesehen oder angeklickt haben. So können wir den\n      Erfolg unserer Anzeigen messen und Interessenten passende Inhalte ausspielen. Auch hier kann\n      eine Übermittlung in die USA erfolgen. Weitere Informationen:\n      <a href=\"https://www.facebook.com/privacy/policy\" target=\"_blank\" rel=\"noopener\">facebook.com/privacy/policy<\/a>.\n    <\/p>\n\n    <h3>TikTok-Pixel<\/h3>\n    <p>\n      Anbieter: TikTok Technology Limited, 10 Earlsfort Terrace, Dublin, D02 T380, Irland.\n      Das TikTok-Pixel misst den Erfolg von Anzeigen auf TikTok und hilft uns, unsere Kampagnen\n      auszuwerten. Weitere Informationen:\n      <a href=\"https://www.tiktok.com/legal/privacy-policy-eea\" target=\"_blank\" rel=\"noopener\">tiktok.com/legal/privacy-policy-eea<\/a>.\n    <\/p>\n\n    <h3>Keine externen Schriftarten und Medien<\/h3>\n    <p>\n      Unabhängig von Ihrer Entscheidung binden wir <strong>keine externen Schriftarten, Karten,\n      Videos oder sonstigen Inhalte von Drittanbietern<\/strong> ein. Alle Gestaltungselemente werden\n      ausschließlich von unserem eigenen Server ausgeliefert. Ohne Einwilligung findet daher\n      überhaupt keine Verbindung zu Servern Dritter statt.\n    <\/p>\n\n    <h2>6. Hosting und Server-Logfiles<\/h2>\n    <p>\n      Diese Website wird gehostet bei: <strong>[Name und Anschrift des Hosting-Anbieters]<\/strong>.\n      Mit dem Anbieter besteht ein Vertrag zur Auftragsverarbeitung nach Art. 28 DSGVO.\n    <\/p>\n    <p>\n      Beim Aufruf der Website werden durch den Hosting-Anbieter automatisch Informationen in sogenannten\n      Server-Logfiles gespeichert, die Ihr Browser übermittelt:\n    <\/p>\n    <ul>\n      <li>Browsertyp und Browserversion<\/li>\n      <li>verwendetes Betriebssystem<\/li>\n      <li>Referrer-URL (zuvor besuchte Seite)<\/li>\n      <li>Hostname des zugreifenden Rechners<\/li>\n      <li>Uhrzeit der Serveranfrage<\/li>\n      <li>IP-Adresse<\/li>\n    <\/ul>\n    <p>\n      Diese Daten werden nicht mit anderen Datenquellen zusammengeführt. Rechtsgrundlage ist\n      Art. 6 Abs. 1 lit. f DSGVO. Unser berechtigtes Interesse liegt im technisch fehlerfreien Betrieb\n      und der Sicherheit der Website. Die Logfiles werden in der Regel nach spätestens 30 Tagen gelöscht.\n    <\/p>\n\n    <h2>7. Photovoltaik-Rechner und Angebotsanfrage<\/h2>\n    <p>\n      Die Eingaben im Photovoltaik-Rechner (Gebäudetyp, Dachausrichtung, Stromkosten, geplante\n      Komponenten) werden ausschließlich in Ihrem Browser verarbeitet, um das Ergebnis zu berechnen.\n      Eine Übertragung an uns findet <strong>erst dann<\/strong> statt, wenn Sie im letzten Schritt\n      aktiv ein Angebot anfordern und das Formular absenden.\n    <\/p>\n    <p>\n      In diesem Fall verarbeiten wir folgende Daten:\n    <\/p>\n    <ul>\n      <li>Name, Postleitzahl, Telefonnummer und E-Mail-Adresse<\/li>\n      <li>Ihre Angaben aus dem Rechner sowie das berechnete Ergebnis<\/li>\n      <li>Zeitpunkt der Übermittlung und Ihre erteilte Einwilligung<\/li>\n    <\/ul>\n    <p>\n      <strong>Zweck:<\/strong> Bearbeitung Ihrer Anfrage und Vermittlung an einen passenden\n      Photovoltaik-Fachbetrieb.<br>\n      <strong>Rechtsgrundlage:<\/strong> Ihre Einwilligung nach Art. 6 Abs. 1 lit. a DSGVO sowie\n      Art. 6 Abs. 1 lit. b DSGVO für vorvertragliche Maßnahmen.\n    <\/p>\n\n    <h3>Weitergabe an Fachpartner<\/h3>\n    <p>\n      Zur Bearbeitung Ihrer Anfrage geben wir Ihre Daten an unseren Photovoltaik-Fachpartner weiter.\n      Empfänger ist:\n    <\/p>\n    <ul>\n      <li><strong>Energie Plus<\/strong> – <strong>[vollständiger Firmenname und Anschrift eintragen]<\/strong><\/li>\n    <\/ul>\n    <p>\n      Der jeweilige Fachpartner ist für die anschließende Beratung datenschutzrechtlich eigenständig\n      verantwortlich. Eine Weitergabe erfolgt ausschließlich auf Grundlage Ihrer Einwilligung.\n      Ihre Daten werden nicht an mehrere Betriebe gleichzeitig und nicht zu Werbezwecken Dritter\n      weitergegeben.\n    <\/p>\n\n    <h2>8. Bewerbungen<\/h2>\n    <p>\n      Wenn Sie sich über das Bewerbungsformular als Vertriebspartner bewerben, verarbeiten wir die von\n      Ihnen angegebenen Daten: Vor- und Nachname, E-Mail-Adresse, Telefonnummer, gewünschter Standort,\n      gewünschter Starttermin, Angaben zur Vertriebserfahrung, Ihre Nachricht sowie – sofern Sie eine\n      solche hochladen – Ihre Bewerbungsunterlagen.\n    <\/p>\n    <p>\n      <strong>Zweck:<\/strong> Durchführung des Bewerbungsverfahrens.<br>\n      <strong>Rechtsgrundlage:<\/strong> Art. 6 Abs. 1 lit. b DSGVO (Anbahnung eines\n      Vertragsverhältnisses) sowie Ihre Einwilligung nach Art. 6 Abs. 1 lit. a DSGVO.\n    <\/p>\n    <p>\n      Kommt es nicht zu einer Zusammenarbeit, löschen wir Ihre Bewerbungsdaten spätestens sechs Monate\n      nach Abschluss des Verfahrens. Möchten Sie, dass wir Ihre Unterlagen für spätere Gelegenheiten\n      aufbewahren, holen wir dafür Ihre gesonderte Einwilligung ein. Kommt eine Zusammenarbeit zustande,\n      werden die Daten in das Vertragsverhältnis überführt.\n    <\/p>\n\n    <h2>9. Anfragen von Unternehmen<\/h2>\n    <p>\n      Über das Formular für Photovoltaik-Fachbetriebe verarbeiten wir Unternehmensname,\n      Ansprechpartner, Position, E-Mail-Adresse, Telefonnummer, Zielregion, angegebenen Bedarf und\n      Ihre Nachricht – ausschließlich zur Bearbeitung Ihrer Anfrage und zur Anbahnung einer\n      Geschäftsbeziehung. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO sowie Ihre Einwilligung\n      nach Art. 6 Abs. 1 lit. a DSGVO.\n    <\/p>\n\n    <h2>10. Kontaktaufnahme per E-Mail oder Telefon<\/h2>\n    <p>\n      Wenn Sie uns per E-Mail oder Telefon kontaktieren, werden Ihre Angaben zur Bearbeitung des\n      Anliegens gespeichert. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO, sofern Ihre Anfrage mit\n      einem Vertrag zusammenhängt, ansonsten Art. 6 Abs. 1 lit. f DSGVO (berechtigtes Interesse an der\n      Bearbeitung von Anfragen). Die Daten verbleiben bei uns, bis der Zweck entfällt und keine\n      gesetzlichen Aufbewahrungspflichten entgegenstehen.\n    <\/p>\n\n    <h2>11. Speicherdauer<\/h2>\n    <p>\n      Wir speichern personenbezogene Daten nur so lange, wie es für die genannten Zwecke erforderlich\n      ist oder gesetzliche Aufbewahrungsfristen (insbesondere handels- und steuerrechtliche Fristen von\n      sechs bzw. zehn Jahren) dies vorschreiben. Anschließend werden die Daten gelöscht.\n    <\/p>\n\n    <h2>12. Ihre Rechte<\/h2>\n    <p>Ihnen stehen gegenüber uns folgende Rechte hinsichtlich Ihrer personenbezogenen Daten zu:<\/p>\n    <ul>\n      <li><strong>Auskunft<\/strong> über die von uns verarbeiteten Daten (Art. 15 DSGVO)<\/li>\n      <li><strong>Berichtigung<\/strong> unrichtiger Daten (Art. 16 DSGVO)<\/li>\n      <li><strong>Löschung<\/strong> Ihrer Daten (Art. 17 DSGVO)<\/li>\n      <li><strong>Einschränkung<\/strong> der Verarbeitung (Art. 18 DSGVO)<\/li>\n      <li><strong>Datenübertragbarkeit<\/strong> (Art. 20 DSGVO)<\/li>\n      <li><strong>Widerspruch<\/strong> gegen die Verarbeitung (Art. 21 DSGVO)<\/li>\n      <li><strong>Widerruf einer Einwilligung<\/strong> mit Wirkung für die Zukunft (Art. 7 Abs. 3 DSGVO)<\/li>\n    <\/ul>\n    <p>\n      Ihre Einwilligung in die Analyse-Dienste widerrufen Sie am schnellsten über den Link <a href=\"#\" data-consent-reset>Cookie-Einstellungen<\/a> im Seitenfuß. Für alle übrigen Rechte genügt eine formlose Nachricht an\n      <a href=\"mailto:info@solvera-sales.de\">info@solvera-sales.de<\/a>.\n    <\/p>\n\n    <h2>13. Beschwerderecht bei der Aufsichtsbehörde<\/h2>\n    <p>\n      Sie haben das Recht, sich bei einer Datenschutz-Aufsichtsbehörde zu beschweren. Zuständig für uns ist:\n    <\/p>\n    <p>\n      Der Landesbeauftragte für den Datenschutz und die Informationsfreiheit Baden-Württemberg<br>\n      Lautenschlagerstraße 20, 70173 Stuttgart<br>\n      <a href=\"https://www.baden-wuerttemberg.datenschutz.de\" target=\"_blank\" rel=\"noopener\">www.baden-wuerttemberg.datenschutz.de<\/a>\n    <\/p>\n\n    <h2>14. SSL-/TLS-Verschlüsselung<\/h2>\n    <p>\n      Diese Website nutzt aus Sicherheitsgründen eine SSL- bzw. TLS-Verschlüsselung. Eine verschlüsselte\n      Verbindung erkennen Sie daran, dass die Adresszeile des Browsers mit <code>https://<\/code> beginnt.\n      Bei aktivierter Verschlüsselung können die Daten, die Sie an uns übermitteln, nicht von Dritten\n      mitgelesen werden.\n    <\/p>\n\n    <h2>15. Änderungen dieser Datenschutzerklärung<\/h2>\n    <p>\n      Wir passen diese Datenschutzerklärung an, sobald Änderungen der von uns eingesetzten Verfahren\n      dies erforderlich machen. Es gilt jeweils die auf dieser Seite abrufbare Fassung.\n    <\/p>\n\n    <p class=\"mt-48\"><a class=\"link-arrow\" href=\"index.html\">Zurück zur Startseite\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" s
